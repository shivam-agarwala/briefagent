name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # The suite is fully offline. No API key, no network, no secrets needed.
        run: python -m pytest -q

      - name: Check for em dashes
        # House style. Fails the build rather than letting one slip into a doc.
        # Done in Python rather than grep so the check does not match its own
        # pattern, and so the shell escape works the same on every runner.
        run: |
          python - <<'EOF'
          import pathlib, sys
          exts = {".py", ".md", ".yml", ".yaml", ".txt", ".ini", ".example"}
          bad = []
          for path in pathlib.Path(".").rglob("*"):
              if not path.is_file() or path.suffix not in exts:
                  continue
              if "__pycache__" in str(path) or str(path).startswith(".git/"):
                  continue
              for number, line in enumerate(path.read_text(encoding="utf-8",
                                                           errors="ignore").splitlines(), 1):
                  if "\u2014" in line or "\u2013" in line:
                      bad.append("%s:%d: %s" % (path, number, line.strip()[:100]))
          if bad:
              print("em dash or en dash found:")
              print("\n".join(bad))
              sys.exit(1)
          print("none found")
          EOF
